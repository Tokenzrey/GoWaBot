services:
  whatsapp_go:
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    build:
      context: .
      dockerfile: ./docker/golang.Dockerfile
    restart: "on-failure"
    ports:
      # Host port configurable (default 3000). VPS example: GOWA_HOST_PORT=4719
      # Container always listens on 3000 internally.
      - "${GOWA_HOST_PORT:-3000}:3000"
    env_file:
      - src/.env
    volumes:
      # Persist WhatsApp + chat DBs; entrypoint chowns for gowauser (uid 20001, gid 20000) on start.
      - ./storages:/app/storages
      - ./statics:/app/statics

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: "on-failure"
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - whatsapp_go